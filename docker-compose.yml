services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://YOUR_SERVER_IP:5678/
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# Hermes runs natively via the `hermes-dashboard` systemd service (see index.html
# Step 07), not as a container — there is no hermes-webui service here anymore.

volumes:
  n8n_data:
